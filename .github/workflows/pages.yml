name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Note: `enablement: true` does not work here -- creating a Pages site
      # needs admin rights that GITHUB_TOKEN is not granted, and the run fails
      # with "Resource not accessible by integration". Pages must be turned on
      # once by an admin, either in Settings -> Pages (Source: GitHub Actions)
      # or with:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      - uses: actions/configure-pages@v6

      # The toolkit is plain static HTML with no build step; the repo root is
      # the site. Cross-links between the launcher, playbook and arsenal are
      # relative, so they work unchanged.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
